services:
  - type: web
    name: gsd-sitefinder
    runtime: node
    region: frankfurt
    plan: starter
    buildCommand: npm ci && npm run build
    startCommand: npm start
    healthCheckPath: /health
    autoDeployTrigger: commit
    envVars:
      - key: NODE_VERSION
        value: 22
      - key: VITE_SUPABASE_URL
        sync: false
      - key: VITE_SUPABASE_PUBLISHABLE_KEY
        sync: false
      - key: SITEFINDER_MCP_TOKEN_SHA256
        sync: false
      - key: SUPABASE_SECRET_KEY
        sync: false
      - key: RESEARCH_AGENT_INGEST_TOKEN
        sync: false
      - key: RESEARCH_AGENT_INGEST_TOKEN_SHA256
        value: 11e8dadd07180cd84570f459599fdcae104a78331b93e8a6ee599e0f6285e4e1
      - key: SITEFINDER_URL
        value: https://gsd-sitefinder.onrender.com
