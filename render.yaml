services:
  - type: web
    name: gsd-sitefinder
    runtime: node
    region: frankfurt
    plan: starter
    buildCommand: npm ci && npm run build
    startCommand: npm start
    healthCheckPath: /health
    autoDeployTrigger: commit
    envVars:
      - key: NODE_VERSION
        value: 22
      - key: VITE_SUPABASE_URL
        sync: false
      - key: VITE_SUPABASE_PUBLISHABLE_KEY
        sync: false
      - key: SITEFINDER_MCP_TOKEN_SHA256
        sync: false
      - key: SUPABASE_SECRET_KEY
        sync: false
      - key: RESEARCH_AGENT_INGEST_TOKEN
        sync: false
      - key: RESEARCH_AGENT_INGEST_TOKEN_SHA256
        value: 25dd085e16d197367730a1fc72b94d5efdcf0e23ebbb81f84fd3764ccf09d263
      - key: SITEFINDER_URL
        value: https://gsd-sitefinder.onrender.com
