services:
  - type: web
    name: gsd-sitefinder
    runtime: node
    region: frankfurt
    plan: starter
    buildCommand: npm ci && npm run build
    startCommand: npm start
    healthCheckPath: /health
    autoDeployTrigger: commit
    envVars:
      - key: NODE_VERSION
        value: 22
      - key: VITE_SUPABASE_URL
        sync: false
      - key: VITE_SUPABASE_PUBLISHABLE_KEY
        sync: false
      - key: SITEFINDER_MCP_TOKEN_SHA256
        sync: false
      - key: SUPABASE_SECRET_KEY
        sync: false
      - key: RESEARCH_AGENT_INGEST_TOKEN
        sync: false
      - key: RESEARCH_AGENT_INGEST_TOKEN_SHA256
        value: b82d19ce204fe4cde9648a6fd16c00da69531b46e37120df59ea6303c0945855
      - key: SITEFINDER_URL
        value: https://gsd-sitefinder.onrender.com
