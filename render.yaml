services:
  - type: web
    name: gsd-sitefinder
    runtime: node
    region: frankfurt
    plan: starter
    buildCommand: npm ci && npm run build
    startCommand: npm start
    healthCheckPath: /health
    autoDeployTrigger: commit
    envVars:
      - key: NODE_VERSION
        value: 22
      - key: VITE_SUPABASE_URL
        sync: false
      - key: VITE_SUPABASE_PUBLISHABLE_KEY
        sync: false
      - key: SITEFINDER_URL
        value: https://gsd-sitefinder.onrender.com
      - key: SITEFINDER_MCP_TOKEN_SHA256
        value: a536da901c6ba6c3cf18a33b049a1c274013d5574dd0349a70fe47a0cdc36954
