name: CI

on:
  push:
    branches:
      - main
  pull_request:

permissions:
  contents: read

env:
  DO_NOT_TRACK: "1"

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  node-checks:
    name: Node checks
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Check out repository
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5

      - name: Set up Node.js
        uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5
        with:
          node-version: 22.x
          cache: npm

      - name: Install locked dependencies
        run: npm ci

      - name: Run unit tests
        run: npm test

      - name: Build production bundle
        run: npm run build

      - name: Audit all root dependencies
        run: npm audit

  deno-tests:
    name: Deno tests
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - name: Check out repository
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5

      - name: Set up Deno
        uses: denoland/setup-deno@22d081ff2d3a40755e97629de92e3bcbfa7cf2ed # v2.0.5
        with:
          deno-version: v2.8.1

      - name: Run Edge helper tests
        run: deno test supabase/functions/_shared/*.test.ts

      - name: Type-check CCS sync function
        run: deno check supabase/functions/sync-ccs-projects/index.ts

  database-tests:
    name: Database migrations and RLS
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Check out repository
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5

      - name: Set up Node.js
        uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5
        with:
          node-version: 22.x
          cache: npm

      - name: Install locked dependencies
        run: npm ci

      - name: Confirm Docker is available
        run: docker version

      - name: Start local Supabase stack
        run: npx --no-install supabase start

      - name: Apply every migration from a clean local database
        run: npx --no-install supabase db reset --local --no-seed

      - name: Run database security and integrity tests
        run: npx --no-install supabase test db --local supabase/tests/database

  research-worker-checks:
    name: Research worker checks
    runs-on: ubuntu-latest
    timeout-minutes: 10

    defaults:
      run:
        working-directory: services/research-worker

    steps:
      - name: Check out repository
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5

      - name: Set up Node.js
        uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5
        with:
          node-version: 22.x
          cache: npm
          cache-dependency-path: services/research-worker/package-lock.json

      - name: Install locked dependencies
        run: npm ci

      - name: Run worker type and unit checks
        run: npm run check

      - name: Build worker
        run: npm run build

      - name: Audit worker production dependencies
        run: npm audit --omit=dev
